version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - chemistry-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGO_URI=mongodb://db:27017/chemistry_db
      - MONGO_DB_NAME=chemistry_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ENVIRONMENT=production
    depends_on:
      - db
    networks:
      - chemistry-network
    restart: unless-stopped

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - chemistry-network
    restart: unless-stopped

networks:
  chemistry-network:
    driver: bridge

volumes:
  mongo-data:
